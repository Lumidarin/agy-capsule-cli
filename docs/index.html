<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule CLI · Interactive Configurator</title>
<style>
  :root {
    --bg: #efece6;
    --surface: #faf9f6;
    --surface-2: #f3f0ea;
    --border: #dcd7ce;
    --border-strong: #c6bfb3;
    --text: #1c1e21;
    --muted: #657077;
    --accent: #4c626b;
    --accent-soft: #e5ecef;
    --accent-border: #8fa3ac;
    --accent-hover: #354850;
    --ok: #2e7d52;
    --radius: 12px;
    --mono: 'Cascadia Mono', 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 56px; }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 4px; font-size: 23px; letter-spacing: -0.02em; }
  .subtitle { margin: 0; color: var(--muted); font-size: 13.5px; }

  .pill-group {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .pill-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 10px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .pill-btn:hover { color: var(--text); }
  .pill-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  .preview-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    margin-bottom: 14px;
  }
  .preview-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .preview-bar-left, .preview-bar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .width-control {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
  }
  .width-control input { width: 84px; accent-color: var(--accent); cursor: pointer; }
  .width-val { font-family: var(--mono); min-width: 28px; text-align: right; color: var(--text); }

  .terminals { display: grid; gap: 10px; }
  .terminal {
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  .terminal.light { background: #faf9f6; color: #161616; border-color: #dcd7ce; }
  .terminal.dark { background: #282c34; color: #f1f3f5; border-color: #3e4451; }
  .terminal-tag {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    opacity: 0.65;
  }
  .terminal pre {
    margin: 0;
    font: 15px/1.65 var(--mono);
    white-space: pre;
  }
  .terminal pre .empty-hint { opacity: 0.5; font-style: italic; }

  .controls-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .controls-bottom {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .color-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
  }

  /* Spatial statusline strip: left items on left, right items on right */
  .strip {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .side {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .cluster {
    display: inline-flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 4px 5px;
  }
  .cluster.disabled { opacity: 0.42; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background .14s, border-color .14s, color .14s, box-shadow .14s;
  }
  .chip:hover:not(:disabled) {
    border-color: var(--accent-border);
    color: var(--text);
  }
  .chip.on {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-hover);
    font-weight: 600;
  }
  .chip:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Dropdown chip */
  .dd {
    position: relative;
    display: inline-flex;
  }
  .dd-caret {
    font-size: 10px;
    line-height: 1;
    opacity: 0.75;
    margin-left: 1px;
  }
  .dd-menu {
    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    min-width: 112px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 4px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.14);
    z-index: 40;
    display: none;
    flex-direction: column;
    gap: 2px;
  }
  .dd.open .dd-menu { display: flex; }
  .dd-item {
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .dd-item:hover { background: var(--surface-2); }
  .dd-item.selected {
    background: var(--accent-soft);
    color: var(--accent-hover);
    font-weight: 600;
  }
  .dd-check { font-size: 11px; opacity: 0; }
  .dd-item.selected .dd-check { opacity: 1; }

  .side.right .dd-menu { left: auto; right: 0; }

  .output-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .output-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .code-wrap {
    position: relative;
    background: #1f2329;
    border-radius: 9px;
    display: flex;
    align-items: flex-start;
  }
  .output-box {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: #eef1f5;
    padding: 13px 48px 13px 15px;
    font: 13px/1.6 var(--mono);
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
  }
  .copy-icon-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #cdd5df;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .copy-icon-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.28);
  }
  .copy-icon-btn.copied {
    background: rgba(46, 125, 82, 0.28);
    border-color: rgba(74, 222, 128, 0.55);
    color: #86efac;
  }
  .output-hint { margin: 9px 0 0; font-size: 12.5px; color: var(--muted); }
  footer {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Capsule CLI Configurator</h1>
      <p class="subtitle" data-i18n="subtitle">点击下方方块开关每一项、点 ▾ 下拉选样式，一键复制指令发给 Agent 生效。</p>
    </div>
    <div class="pill-group" role="group" aria-label="Language">
      <button class="pill-btn active" data-lang="zh">中文</button>
      <button class="pill-btn" data-lang="en">EN</button>
    </div>
  </header>

  <section class="preview-card">
    <div class="preview-bar">
      <div class="preview-bar-left">
        <div class="pill-group" id="scenario-pills">
          <button class="pill-btn active" data-scenario="normal" data-i18n="scNormal">正常</button>
          <button class="pill-btn" data-scenario="yellow" data-i18n="scYellow">黄提醒</button>
          <button class="pill-btn" data-scenario="red" data-i18n="scRed">红告警</button>
          <button class="pill-btn" data-scenario="working" data-i18n="scWorking">运行中</button>
          <button class="pill-btn" data-scenario="claude">Claude</button>
          <button class="pill-btn" data-scenario="argon">Argon</button>
        </div>
      </div>
      <div class="preview-bar-right">
        <div class="pill-group" role="group" aria-label="Theme">
          <button class="pill-btn" data-theme="both" data-i18n="themeBoth">日 + 夜</button>
          <button class="pill-btn" data-theme="light" data-i18n="themeLight">浅色</button>
          <button class="pill-btn active" data-theme="dark" data-i18n="themeDark">深色</button>
        </div>
        <label class="width-control">
          <span data-i18n="widthLabel">终端宽度</span>
          <input id="width-slider" type="range" min="48" max="120" value="104">
          <span class="width-val" id="width-val">104</span>
        </label>
      </div>
    </div>
    <div class="terminals" id="terminals"></div>
  </section>

  <section class="controls-card">
    <div class="strip">
      <!-- Left side in exact statusline order -->
      <div class="side left">
        <div class="cluster">
          <div class="dd" data-select="contextLabel" data-parent="context"></div>
          <button class="chip" type="button" data-show="context" data-i18n="chipCtx">占用 %</button>
          <button class="chip" type="button" data-show="capacity" data-parent="context" data-i18n="chipCap">容量</button>
          <div class="dd" data-select="context" data-parent="context"></div>
        </div>

        <div class="cluster">
          <div class="dd" data-select="cacheLabel" data-parent="cache"></div>
          <button class="chip" type="button" data-show="cache" data-i18n="chipCache">命中 %</button>
          <div class="dd" data-select="cache" data-parent="cache"></div>
        </div>

        <div class="cluster">
          <button class="chip" type="button" data-show="state" data-i18n="chipState">状态</button>
        </div>
      </div>

      <!-- Right side in exact statusline order -->
      <div class="side right">
        <div class="cluster">
          <button class="chip" type="button" data-show="quota" data-i18n="chipQuota">额度</button>
          <div class="dd" data-select="quota" data-parent="quota"></div>
          <button class="chip" type="button" data-show="quotaGroup" data-parent="quota" data-i18n="chipGroup">组名</button>
        </div>

        <div class="cluster" data-parent="quota">
          <div class="dd" data-select="quota5hLabel" data-parent="quota,quota5h"></div>
          <button class="chip" type="button" data-show="quota5h" data-parent="quota" data-i18n="chipQ5h">5h</button>
          <button class="chip" type="button" data-show="reset5h" data-parent="quota,quota5h" data-i18n="chipR5h">倒计时</button>
        </div>

        <div class="cluster" data-parent="quota">
          <div class="dd" data-select="quotaWeeklyLabel" data-parent="quota,quotaWeekly"></div>
          <button class="chip" type="button" data-show="quotaWeekly" data-parent="quota" data-i18n="chipQw">周</button>
          <button class="chip" type="button" data-show="resetWeekly" data-parent="quota,quotaWeekly" data-i18n="chipRw">倒计时</button>
        </div>
      </div>
    </div>

    <div class="controls-bottom">
      <div class="color-row">
        <span data-i18n="textColorLabel">正文颜色：</span>
        <div class="pill-group" data-select="textColor">
          <button class="pill-btn" data-val="inherit" data-i18n="tcInherit" title="跟随终端 / color scheme 正文色">跟随正文</button>
          <button class="pill-btn" data-val="fixed" data-i18n="tcFixed" title="浅色固定黑、深色固定白，不被彩色主题染色">固定黑白</button>
          <button class="pill-btn" data-val="muted" data-i18n="tcMuted" title="指标行正文也采用柔和灰，仅黄/红告警突出">柔和灰</button>
        </div>
      </div>
    </div>
  </section>

  <section class="output-card">
    <div class="output-head">
      <div class="pill-group" id="output-tabs">
        <button class="pill-btn active" data-tab="agent" data-i18n="tabAgent">发给 Agent (/capsule-guide)</button>
        <button class="pill-btn" data-tab="cli" data-i18n="tabCli">终端命令 (settings.mjs)</button>
        <button class="pill-btn" data-tab="json">settings.json</button>
      </div>
    </div>
    <div class="code-wrap">
      <pre class="output-box" id="output-box"></pre>
      <button class="copy-icon-btn" id="copy-btn" type="button" aria-label="Copy" title="复制">
        <svg id="copy-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <p class="output-hint" id="output-hint"></p>
  </section>

  <footer>
    <span data-i18n="footerNote">实际终端字体宽度可能略有差异。</span>
    <span>
      <a href="https://github.com/Lumidarin/agy-capsule-cli" target="_blank" rel="noreferrer">GitHub</a>
      · <a href="preview.html" data-i18n="staticPreview">静态预览页</a>
    </span>
  </footer>
</div>

<script>
const MODES = {
  standard: {
    context: true, capacity: true,
    cache: true, state: true,
    quota: true, quotaGroup: true, quota5h: true, quotaWeekly: true,
    reset5h: true, resetWeekly: true,
  },
  compact: {
    context: true, capacity: true,
    cache: false, state: false,
    quota: true, quotaGroup: false, quota5h: true, quotaWeekly: true,
    reset5h: true, resetWeekly: true,
  },
};
const MODE_LABELS = {
  standard: { contextLabel: 'en', cacheLabel: 'en' },
  compact: { contextLabel: 'off', cacheLabel: 'off' },
};
const SHOW_KEYS = Object.keys(MODES.standard);
const DEFAULTS = {
  mode: 'standard',
  textColor: 'inherit',
  context: 'text',
  cache: 'dot',
  quota: 'dot',
  contextLabel: 'en',
  cacheLabel: 'en',
  quota5hLabel: 'icon',
  quotaWeeklyLabel: 'icon',
  show: { ...MODES.standard },
};
const PALETTES = {
  light: { body: 'rgb(22,22,22)', muted: 'rgb(91,107,115)', neutral: 'rgb(138,144,151)', amber: 'rgb(152,97,0)', red: 'rgb(208,42,48)' },
  dark: { body: 'rgb(241,243,245)', muted: 'rgb(185,195,208)', neutral: 'rgb(185,195,208)', amber: 'rgb(255,209,102)', red: 'rgb(255,133,133)' },
};
const CONTEXT_LABELS = { en: 'Ctx', zh: '上下文', off: '' };
const CACHE_LABELS = { en: 'Cache', zh: '缓存', off: '' };
const WINDOW_LABELS = {
  '5h': { icon: '🕔', short: '5h', zh: '5小时', off: '' },
  weekly: { icon: '📅', short: 'w', zh: '周', off: '' },

const KNOWN_BUCKETS = {

  'gemini-weekly': ['Gemini', 'weekly'],

const SCENARIOS = {

      quota: { 'gemini-5h': { remaining_fraction: 0.25, reset_in_seconds: 8760 }, 'gemini-weekly': { remaining_fraction: 0.19, reset_in_seconds: 342000 } },
    },
  },
  red: {

    payload: {

      quota: { 'gemini-5h': { remaining_fraction: 0.96, reset_in_seconds: 8760 }, 'gemini-weekly': { remaining_fraction: 0.10, reset_in_seconds: 342000 } },

  },
  working: {
    ageSec: 45,
    payload: {
      model: { id: 'gemini-hydrogen', display_name: 'Gemini 4 Hydrogen', effort: 'medium' },

  claude: {
    ageSec: 90,
    payload: {
      model: { id: 'claude-sonnet-4-6', display_name: 'Claude Sonnet 4.6', effort: 'high' },

  },
  argon: {
    ageSec: 60,
    payload: {
      model: { id: 'gemini-argon', display_name: 'Gemini 4 Argon', effort: 'high' },
      agent_state: 'idle',

      quota: { 'gemini-argon-wtu-weekly': { remaining_fraction: 0.16, reset_in_seconds: 346122 } },
    },
  },
};

const I18N = {
  zh: {
    subtitle: '点击下方方块开关每一项、点 ▾ 下拉选样式，一键复制指令发给 Agent 生效。',

    scNormal: '正常', scYellow: '黄提醒', scRed: '红告警', scWorking: '运行中',
    widthLabel: '终端宽度',
    textColorLabel: '正文颜色：', tcInherit: '跟随正文', tcFixed: '固定黑白', tcMuted: '柔和灰',
    chipCtx: '占用 %', chipCap: '容量', chipCache: '命中 %', chipState: '状态',
    chipQuota: '额度', chipGroup: '组名', chipQ5h: '5h', chipR5h: '倒计时', chipQw: '周', chipRw: '倒计时',
    tabAgent: '发给 Agent (/capsule-guide)', tabCli: '终端命令 (settings.mjs)',
    copyTip: '复制', copiedTip: '已复制',
    hintAgent: '直接粘贴到 Antigravity 对话中发送，已安装 /capsule-guide skill 的 Agent 会自动调用本地 helper 生效。',
    hintCli: '在 PowerShell / bash / zsh 中运行即可，无需消耗模型调用；下一次底栏刷新生效。',
    hintJson: '保存到 ~/.gemini/config/agy-capsule/cli/settings.json；下一次底栏刷新生效。',

let lang = 'zh';
let viewTheme = 'dark';
let scenarioKey = 'normal';
let outputTab = 'agent';
let termWidth = 104;
const state = structuredClone(DEFAULTS);

const esc = s => s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
const span = (text, tone, theme) => `<span style="color:${PALETTES[theme][tone]}">${esc(text)}</span>`;
function charWidth(ch) {
  const cp = ch.codePointAt(0);
  if (cp > 0xffff) return 2;
  if ((cp >= 0x2e80 && cp <= 0x9fff) || (cp >= 0xf900 && cp <= 0xfaff) || (cp >= 0xff00 && cp <= 0xff60)) return 2;
  return 1;
}
function displayWidth(text) { let w = 0; for (const ch of text) w += charWidth(ch); return w; }
function clipText(text, budget) {
  let out = '', used = 0;
  for (const ch of text) { const w = charWidth(ch); if (used + w > budget) break; out += ch; used += w; }
  return out;
}
function formatTokens(n) {
  if (n < 1000) return String(Math.round(n));
  return n < 999950 ? `${(n / 1000).toFixed(1)}K` : `${(n / 1000000).toFixed(1)}M`;
}
function resetText(bucket) {
  const seconds = bucket.reset_in_seconds;
  if (seconds == null) return '';
  if (seconds <= 0) return ' (due)';
  if (seconds < 60) return ' (<1m)';
  const minutes = Math.ceil(seconds / 60);
  if (minutes < 60) return ` (${minutes}m)`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return ` (${hours}h ${minutes % 60}m)`;
  return ` (${Math.floor(hours / 24)}d ${hours % 24}h)`;
}
function currentGroup(model, quota) {
  const name = `${model?.id || ''} ${model?.display_name || ''}`.toLowerCase();
  if (/claude|sonnet|opus|haiku/.test(name)) return 'Claude';
  if (name.includes('argon') && quota?.['gemini-argon-wtu-weekly']) return 'Argon';
  if (/gemini|hydrogen|argon/.test(name)) return 'Gemini';
  return null;
}
function quotaTone(payload, show) {
  const selected = currentGroup(payload.model, payload.quota);
  let shortTone = 'neutral';
  for (const [id, bucket] of Object.entries(payload.quota || {})) {
    if (!bucket || bucket.disabled === true || KNOWN_BUCKETS[id]?.[0] !== selected) continue;
    const kind = KNOWN_BUCKETS[id][1];
    if (kind === '5h' && !show.quota5h) continue;
    if (kind === 'weekly' && !show.quotaWeekly) continue;
    const pct = Math.round(bucket.remaining_fraction * 100);
    const tone = pct <= 10 ? 'red' : pct <= 25 ? 'amber' : 'neutral';
    if (kind === 'weekly' && tone === 'red') return 'red';
    if (kind === '5h') shortTone = tone;
  }
  return shortTone;
}
function renderModelLineHtml(payload, theme) {
  const width = Math.max(1, termWidth - 2);
  const effort = payload.model.effort || '';
  const right = (payload.model.display_name + (effort ? ` · ${effort}` : '')).slice(0, width);
  let left = ['working', 'tool_use'].includes(payload.agent_state) ? 'esc to cancel' : '? for shortcuts';
  if (left.length + 2 + right.length > width) left = '';
  const line = left + ' '.repeat(width - left.length - right.length) + right;
  return span(line, 'muted', theme);
}
function renderStatusHtml(payload, ageSec, theme) {
  const { show } = state;
  const width = Math.max(1, termWidth - 2);
  const ctx = payload.context_window;
  const pct = `${ctx.used_percentage.toFixed(1)}%`;
  const ctxPrefix = CONTEXT_LABELS[state.contextLabel] || '';
  const contextBase = show.context ? (ctxPrefix ? `${ctxPrefix} ${pct}` : pct) : '';
  const capacityText = show.context && show.capacity ? ` (${formatTokens(ctx.context_window_size)})` : '';
  const u = ctx.current_usage;
  const cachePrefix = CACHE_LABELS[state.cacheLabel] || '';
  let cacheBlock = '';
  if (show.cache && u && width >= 30) {
    const hit = `${(u.cache_read_input_tokens / (u.input_tokens + u.cache_read_input_tokens) * 100).toFixed(1)}%`;
    cacheBlock = `${cachePrefix ? cachePrefix + ' ' : ''}${hit}${state.cache === 'dot' ? ' ●' : ''}`;
  }
  const stateLabel = show.state && payload.agent_state !== 'idle' ? payload.agent_state : '';
  const buildLeft = (opts) => {
    const parts = [];
    if (opts.withContext && show.context) {
      const core = opts.shortContext ? (state.contextLabel === 'en' ? `C ${pct}` : pct) : contextBase;
      parts.push(core + (opts.withCapacity ? capacityText : ''));
    }
    if (opts.withCache && cacheBlock) parts.push(cacheBlock);
    let text = parts.join('  ');
    if (opts.withState && stateLabel) text = text ? `${text} | ${stateLabel}` : stateLabel;
    return text;
  };
  const quotaEnabled = show.quota && (show.quota5h || show.quotaWeekly);
  const buildRight = (countdown, showName) => {
    if (!quotaEnabled) return '';
    const selected = currentGroup(payload.model, payload.quota);
    if (!selected) return '--';
    const parts = [];
    for (const [id, bucket] of Object.entries(payload.quota)) {
      const meta = KNOWN_BUCKETS[id];
      if (!meta || meta[0] !== selected || bucket.disabled) continue;
      const kind = meta[1];
      if (kind === '5h' && !show.quota5h) continue;
      if (kind === 'weekly' && !show.quotaWeekly) continue;
      const labelMode = kind === '5h' ? state.quota5hLabel : state.quotaWeeklyLabel;
      const prefix = WINDOW_LABELS[kind][labelMode] || '';
      const showReset = countdown && (kind === '5h' ? show.reset5h : show.resetWeekly);
      parts.push(`${prefix ? prefix + ' ' : ''}${Math.round(bucket.remaining_fraction * 100)}%${showReset ? resetText(bucket) : ''}`);
    }
    if (!parts.length) return '--';
    return `${state.quota === 'dot' ? '● ' : ''}${showName ? selected + ' ' : ''}${parts.join(' ')}`;
  };

  let leftOpts = { withContext: true, withCapacity: true, withCache: true, withState: true, shortContext: false };
  let left = buildLeft(leftOpts);
  let right = buildRight(width >= 70, show.quotaGroup);
  const fits = () => displayWidth(left) + (left && right ? 2 : 0) + displayWidth(right) <= width;

  if (!fits()) { leftOpts = { ...leftOpts, withState: false }; left = buildLeft(leftOpts); }
  if (!fits()) right = buildRight(false, show.quotaGroup);
  if (!fits() && show.context) { leftOpts = { ...leftOpts, withCache: false }; left = buildLeft(leftOpts); }
  if (!fits()) { leftOpts = { ...leftOpts, withCapacity: false }; left = buildLeft(leftOpts); }
  if (!fits()) right = buildRight(false, false);
  let leftClipped = false;
  if (!fits()) {
    if (right) {
      leftOpts = { withContext: width >= 12 && show.context, withCapacity: false, withCache: false, withState: false, shortContext: true };
      left = buildLeft(leftOpts);
      const budget = Math.max(1, width - displayWidth(left) - (left ? 1 : 0));
      right = clipText(right, budget);
    } else {
      leftOpts = { ...leftOpts, withCache: show.context ? false : leftOpts.withCache, shortContext: true };
      left = buildLeft(leftOpts);
      if (!fits()) { left = clipText(left, width); leftClipped = true; }
    }
  }
  if (!left && !right) return `<span class="empty-hint">${esc(I18N[lang].emptyLine)}</span>`;

  const padding = right ? ' '.repeat(Math.max(0, width - displayWidth(left) - displayWidth(right))) : '';
  const cacheTone = ageSec >= 240 ? 'red' : ageSec >= 180 ? 'amber' : 'neutral';
  let leftHtml = esc(left);
  if (left && !leftClipped) {
    const parts = [];
    if (leftOpts.withContext && show.context) {
      const coreText = leftOpts.shortContext ? (state.contextLabel === 'en' ? `C ${pct}` : pct) : contextBase;
      let coreHtml = esc(coreText);
      if (state.context === 'text' && ctx.used_percentage >= 75) {
        coreHtml = coreHtml.replace(esc(pct), span(pct, ctx.used_percentage >= 90 ? 'red' : 'amber', theme));
      }
      parts.push(coreHtml + (leftOpts.withCapacity ? esc(capacityText) : ''));
    }
    if (leftOpts.withCache && cacheBlock) {
      let cHtml = esc(cacheBlock);
      if (state.cache === 'dot') cHtml = cHtml.replace('●', span('●', cacheTone, theme));
      else if (state.cache === 'text' && cacheTone !== 'neutral') cHtml = span(cacheBlock, cacheTone, theme);
      parts.push(cHtml);
    }
    leftHtml = parts.join('  ');
    if (leftOpts.withState && stateLabel) leftHtml = leftHtml ? `${leftHtml} | ${esc(stateLabel)}` : esc(stateLabel);
  }
  let rightHtml = esc(right);
  if (right) {
    if (state.quota === 'dot') rightHtml = rightHtml.replace('●', span('●', quotaTone(payload, show), theme));
    else if (state.quota === 'text') {
      rightHtml = rightHtml.replace(/\b(\d+)%/g, (m, p) => Number(p) <= 25 ? span(m, Number(p) <= 10 ? 'red' : 'amber', theme) : m);
    }
  }
  const baseColor = state.textColor === 'fixed' ? PALETTES[theme].body : state.textColor === 'muted' ? PALETTES[theme].muted : null;
  const rowHtml = leftHtml + padding + rightHtml;
  return baseColor ? `<span style="color:${baseColor}">${rowHtml}</span>` : rowHtml;
}

function diffCount(modeName) {
  const base = MODES[modeName];
  let n = 0;
  for (const k of SHOW_KEYS) if (state.show[k] !== base[k]) n++;
  if (state.contextLabel !== MODE_LABELS[modeName].contextLabel) n++;
  if (state.cacheLabel !== MODE_LABELS[modeName].cacheLabel) n++;
  return n;
}

function bestMode() {
  return diffCount('compact') < diffCount('standard') ? 'compact' : 'standard';
}

function getOverrides(modeName) {
  const base = MODES[modeName];
  const overrides = {};
  for (const k of SHOW_KEYS) if (state.show[k] !== base[k]) overrides[k] = state.show[k];
  return overrides;
}

function isExactDefault() {
  for (const k of ['textColor', 'context', 'cache', 'quota', 'contextLabel', 'cacheLabel', 'quota5hLabel', 'quotaWeeklyLabel']) {
    if (state[k] !== DEFAULTS[k]) return false;
  }
  return Object.keys(getOverrides('standard')).length === 0;
}

function buildHelperArgs() {
  if (isExactDefault()) return 'reset';
  const modeName = bestMode();
  const args = [
    'set',
    'mode', modeName,
    'textColor', state.textColor,
    'context', state.context,
    'cache', state.cache,
    'quota', state.quota,
    'contextLabel', state.contextLabel,
    'cacheLabel', state.cacheLabel,
    'quota5hLabel', state.quota5hLabel,
    'quotaWeeklyLabel', state.quotaWeeklyLabel,
  ];
  const overrides = getOverrides(modeName);
  for (const [k, v] of Object.entries(overrides)) {
    args.push(`show.${k}`, v ? 'on' : 'off');
  }
  return args.join(' ');
}

function buildSettingsJson() {
  const modeName = bestMode();
  const obj = {
    mode: modeName,
    context: state.context,
    cache: state.cache,
    quota: state.quota,
  };
  if (state.textColor !== DEFAULTS.textColor) obj.textColor = state.textColor;
  if (state.contextLabel !== MODE_LABELS[modeName].contextLabel) obj.contextLabel = state.contextLabel;
  if (state.cacheLabel !== MODE_LABELS[modeName].cacheLabel) obj.cacheLabel = state.cacheLabel;
  if (state.quota5hLabel !== DEFAULTS.quota5hLabel) obj.quota5hLabel = state.quota5hLabel;
  if (state.quotaWeeklyLabel !== DEFAULTS.quotaWeeklyLabel) obj.quotaWeeklyLabel = state.quotaWeeklyLabel;
  const overrides = getOverrides(modeName);
  if (Object.keys(overrides).length) obj.show = overrides;
  return JSON.stringify(obj, null, 2);
}

function currentOutputText() {
  const helperArgs = buildHelperArgs();
  if (outputTab === 'agent') return `/capsule-guide ${helperArgs}`;
  if (outputTab === 'cli') return `node "$HOME/.gemini/config/agy-capsule/cli/settings.mjs" ${helperArgs}`;
  return buildSettingsJson();
}

function closeAllDropdowns(except = null) {
  document.querySelectorAll('.dd.open').forEach(dd => {
    if (dd !== except) dd.classList.remove('open');
  });
}

function renderDropdowns() {
  const defs = I18N[lang].dd;
  document.querySelectorAll('.dd[data-select]').forEach(dd => {
    const key = dd.dataset.select;
    const options = defs[key];
    const currentVal = state[key];
    const current = options.find(o => o.val === currentVal) || options[0];
    const isActive = currentVal !== 'off';
    const parents = dd.dataset.parent ? dd.dataset.parent.split(',') : [];
    const disabled = parents.some(p => !state.show[p]);
    dd.innerHTML = `
      <button class="chip${isActive ? ' on' : ''}" type="button" ${disabled ? 'disabled' : ''}>
        <span>${esc(current.chip)}</span><span class="dd-caret">▾</span>
      </button>
      <div class="dd-menu" role="menu">
        ${options.map(o => `<button class="dd-item${o.val === currentVal ? ' selected' : ''}" type="button" role="menuitem" data-val="${o.val}"><span>${esc(o.menu)}</span><span class="dd-check">✓</span></button>`).join('')}
      </div>
    `;
    const trigger = dd.querySelector(':scope > .chip');
    trigger.addEventListener('click', e => {
      e.stopPropagation();
      const willOpen = !dd.classList.contains('open');
      closeAllDropdowns(dd);
      dd.classList.toggle('open', willOpen);
    });
    dd.querySelectorAll('.dd-item').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        state[key] = item.dataset.val;
        closeAllDropdowns();
        syncUI();
      });
    });
  });
}

function applyI18n() {
  const t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key]) el.textContent = t[key];
  });
  updateCopyButtonLabel(false);
}

const COPY_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function updateCopyButtonLabel(copied) {
  const t = I18N[lang];
  const btn = document.getElementById('copy-btn');
  btn.classList.toggle('copied', copied);
  btn.innerHTML = copied ? CHECK_SVG : COPY_SVG;
  btn.title = copied ? t.copiedTip : t.copyTip;
  btn.setAttribute('aria-label', btn.title);
}

function syncUI() {
  // Toggle chips
  document.querySelectorAll('button.chip[data-show]').forEach(btn => {
    const on = !!state.show[btn.dataset.show];
    btn.classList.toggle('on', on);
    const parents = btn.dataset.parent ? btn.dataset.parent.split(',') : [];
    btn.disabled = parents.some(p => !state.show[p]);
  });
  // Cluster disabled visual
  document.querySelectorAll('.cluster[data-parent]').forEach(cl => {
    const parents = cl.dataset.parent.split(',');
    cl.classList.toggle('disabled', parents.some(p => !state.show[p]));
  });
  // Dropdown chips
  renderDropdowns();
  // Text color pill group
  document.querySelectorAll('.pill-group[data-select]').forEach(group => {
    const key = group.dataset.select;
    group.querySelectorAll('button[data-val]').forEach(btn => {
      btn.classList.toggle('active', state[key] === btn.dataset.val);
    });
  });

  // Render preview
  const sc = SCENARIOS[scenarioKey];
  const themes = viewTheme === 'both' ? ['light', 'dark'] : [viewTheme];
  const container = document.getElementById('terminals');
  container.innerHTML = themes.map(th => {
    const tag = th === 'light' ? I18N[lang].dayTag : I18N[lang].nightTag;
    return `<div class="terminal ${th}"><div class="terminal-tag">${esc(tag)}</div><pre>${renderModelLineHtml(sc.payload, th)}\n${renderStatusHtml(sc.payload, sc.ageSec, th)}</pre></div>`;
  }).join('');

  // Output box + hint
  document.getElementById('output-box').textContent = currentOutputText();
  const t = I18N[lang];
  document.getElementById('output-hint').textContent = outputTab === 'agent' ? t.hintAgent : outputTab === 'cli' ? t.hintCli : t.hintJson;
  updateCopyButtonLabel(false);
}

// Global close dropdown on outside click / Escape
document.addEventListener('click', () => closeAllDropdowns());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllDropdowns(); });

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b === btn));
    applyI18n();
    syncUI();

});

document.querySelectorAll('[data-theme]').forEach(btn => {
  btn.addEventListener('click', () => {
    viewTheme = btn.dataset.theme;
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b === btn));
    syncUI();
  });
});

document.querySelectorAll('#scenario-pills [data-scenario]').forEach(btn => {
  btn.addEventListener('click', () => {
    scenarioKey = btn.dataset.scenario;
    document.querySelectorAll('#scenario-pills [data-scenario]').forEach(b => b.classList.toggle('active', b === btn));
    syncUI();
  });
});

document.getElementById('width-slider').addEventListener('input', e => {
  termWidth = Number(e.target.value);
  document.getElementById('width-val').textContent = String(termWidth);
  syncUI();
});

document.querySelectorAll('button.chip[data-show]').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.dataset.show;
    state.show[key] = !state.show[key];
    syncUI();
  });
});

document.querySelectorAll('.pill-group[data-select]').forEach(group => {
  const key = group.dataset.select;
  group.querySelectorAll('button[data-val]').forEach(btn => {
    btn.addEventListener('click', () => {
      state[key] = btn.dataset.val;
      syncUI();
    });
  });
});

document.querySelectorAll('#output-tabs [data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    outputTab = btn.dataset.tab;
    document.querySelectorAll('#output-tabs [data-tab]').forEach(b => b.classList.toggle('active', b === btn));
    syncUI();
  });
});

let copyTimer = null;
document.getElementById('copy-btn').addEventListener('click', async () => {
  const text = currentOutputText();
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  updateCopyButtonLabel(true);
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => updateCopyButtonLabel(false), 1800);
});

applyI18n();
syncUI();
</script>
</body>
</html>
