<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule CLI · Interactive Configurator</title>
<style>
  :root {
    --bg: #efece6;
    --surface: #faf9f6;
    --surface-2: #f3f0ea;
    --border: #dcd7ce;
    --border-strong: #c6bfb3;
    --text: #1c1e21;
    --muted: #657077;
    --accent: #4c626b;
    --accent-soft: #e5ecef;
    --accent-border: #8fa3ac;
    --accent-hover: #354850;
    --ok: #2e7d52;
    --radius: 12px;
    --ctrl-h: 32px;
    --mono: 'Cascadia Mono', 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { margin: 0 0 4px; font-size: 23px; letter-spacing: -0.02em; }
  .subtitle { margin: 0; color: var(--muted); font-size: 13.5px; }

  .pill-group {
    display: inline-flex;
    align-items: center;
    height: var(--ctrl-h);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .pill-btn {
    height: 100%;
    display: inline-flex;
    align-items: center;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 0 10px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .pill-btn:hover { color: var(--text); }
  .pill-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  .preview-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    margin-bottom: 14px;
  }
  .preview-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .preview-bar-left, .preview-bar-right {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .width-control {
    display: inline-flex;
    align-items: center;
    height: var(--ctrl-h);
    gap: 7px;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0 10px;
  }
  .width-control input { width: 80px; margin: 0; accent-color: var(--accent); cursor: pointer; }
  .width-val { font-family: var(--mono); font-size: 12px; min-width: 26px; text-align: right; color: var(--text); }

  .terminals { display: grid; gap: 10px; }
  .terminal {
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    overflow-x: auto;
  }
  .terminal.light { background: #faf9f6; color: #161616; border-color: #dcd7ce; }
  .terminal.dark { background: #282c34; color: #f1f3f5; border-color: #3e4451; }
  .terminal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
    opacity: 0.62;
  }
  .terminal-tag { text-transform: uppercase; }
  .terminal pre {
    margin: 0;
    font: 15px/1.75 var(--mono);
    white-space: pre;
  }
  .terminal pre .empty-hint { opacity: 0.5; font-style: italic; }

  /* Direct-manipulation clickable tokens in Edit mode */
  .tok {
    display: inline;
    border-radius: 4px;
    padding: 1px 2px;
    margin: -1px -2px;
    cursor: pointer;
    user-select: none;
    transition: opacity .14s, background .14s;
  }
  .terminal.dark .tok:hover { background: rgba(255, 255, 255, 0.13); }
  .terminal.light .tok:hover { background: rgba(76, 98, 107, 0.14); }
  .tok.off { opacity: 0.25; }
  .tok.off:hover { opacity: 0.58; }

  .styles-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px 18px;
  }
  .style-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
  }

  .output-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .output-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .code-wrap {
    position: relative;
    background: #1f2329;
    border-radius: 9px;
    display: flex;
    align-items: flex-start;
  }
  .output-box {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: #eef1f5;
    padding: 13px 48px 13px 15px;
    font: 13px/1.6 var(--mono);
    white-space: pre-wrap;
    word-break: break-all;
    margin: 0;
  }
  .copy-icon-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #cdd5df;
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .copy-icon-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.28);
  }
  .copy-icon-btn.copied {
    background: rgba(46, 125, 82, 0.28);
    border-color: rgba(74, 222, 128, 0.55);
    color: #86efac;
  }
  .output-hint { margin: 9px 0 0; font-size: 12.5px; color: var(--muted); }
  footer {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Capsule CLI Configurator</h1>
      <p class="subtitle" data-i18n="subtitle">在预览中直接点击各项开关显示，调好后复制指令发给 Agent 生效。</p>
    </div>
    <div class="pill-group" role="group" aria-label="Language">
      <button class="pill-btn active" data-lang="zh">中文</button>
      <button class="pill-btn" data-lang="en">EN</button>
    </div>
  </header>

  <section class="preview-card">
    <div class="preview-bar">
      <div class="preview-bar-left">
        <div class="pill-group" id="scenario-pills">
          <button class="pill-btn active" data-scenario="normal" data-i18n="scNormal">正常</button>
          <button class="pill-btn" data-scenario="yellow" data-i18n="scYellow">黄提醒</button>
          <button class="pill-btn" data-scenario="red" data-i18n="scRed">红告警</button>
          <button class="pill-btn" data-scenario="claude">Claude</button>
          <button class="pill-btn" data-scenario="argon">Argon</button>
        </div>
      </div>
      <div class="preview-bar-right">
        <div class="pill-group" role="group" aria-label="Theme">
          <button class="pill-btn" data-theme="both" data-i18n="themeBoth">日 + 夜</button>
          <button class="pill-btn" data-theme="light" data-i18n="themeLight">浅色</button>
          <button class="pill-btn active" data-theme="dark" data-i18n="themeDark">深色</button>
        </div>
        <label class="width-control">
          <span data-i18n="widthLabel">终端宽度</span>
          <input id="width-slider" type="range" min="48" max="120" value="104">
          <span class="width-val" id="width-val">104</span>
        </label>
        <div class="pill-group" role="group" aria-label="View mode">
          <button class="pill-btn active" data-view="edit" data-i18n="viewEdit">编辑</button>
          <button class="pill-btn" data-view="preview" data-i18n="viewPreview">预览</button>
        </div>
      </div>
    </div>
    <div class="terminals" id="terminals"></div>
  </section>

  <section class="styles-card">
    <div class="style-item">
      <span data-i18n="ctxAlert">Ctx 提醒</span>
      <div class="pill-group" data-select="context">
        <button class="pill-btn" data-val="text" data-i18n="optText">文字</button>
        <button class="pill-btn" data-val="off" data-i18n="optOff">关闭</button>
      </div>
    </div>
    <div class="style-item">
      <span data-i18n="cacheAlert">Cache 提醒</span>
      <div class="pill-group" data-select="cache">
        <button class="pill-btn" data-val="dot" data-i18n="optDot">圆点 ●</button>
        <button class="pill-btn" data-val="text" data-i18n="optText">文字</button>
        <button class="pill-btn" data-val="off" data-i18n="optOff">关闭</button>
      </div>
    </div>
    <div class="style-item">
      <span data-i18n="quotaAlert">额度提醒</span>
      <div class="pill-group" data-select="quota">
        <button class="pill-btn" data-val="dot" data-i18n="optDot">圆点 ●</button>
        <button class="pill-btn" data-val="text" data-i18n="optText">文字</button>
        <button class="pill-btn" data-val="off" data-i18n="optOff">关闭</button>
      </div>
    </div>
    <div class="style-item">
      <span data-i18n="textColorLabel">正文颜色</span>
      <div class="pill-group" data-select="textColor">
        <button class="pill-btn" data-val="inherit" data-i18n="tcInherit" title="跟随终端 / color scheme 正文色">跟随正文</button>
        <button class="pill-btn" data-val="fixed" data-i18n="tcFixed" title="浅色固定黑、深色固定白，不被彩色主题染色">固定黑白</button>
        <button class="pill-btn" data-val="muted" data-i18n="tcMuted" title="指标行正文也采用柔和灰，仅黄/红告警突出">柔和灰</button>
      </div>
    </div>
  </section>

  <section class="output-card">
    <div class="output-head">
      <div class="pill-group" id="output-tabs">
        <button class="pill-btn active" data-tab="agent" data-i18n="tabAgent">发给 Agent (/capsule-guide)</button>
        <button class="pill-btn" data-tab="cli" data-i18n="tabCli">终端命令 (settings.mjs)</button>
        <button class="pill-btn" data-tab="json">settings.json</button>
      </div>
    </div>
    <div class="code-wrap">
      <pre class="output-box" id="output-box"></pre>
      <button class="copy-icon-btn" id="copy-btn" type="button" aria-label="Copy" title="复制"></button>
    </div>
    <p class="output-hint" id="output-hint"></p>
  </section>

  <footer>
    <span data-i18n="footerNote">实际终端字体宽度可能略有差异。</span>
  </footer>
</div>

<script>
const MODES = {
  standard: {
    contextLabel: true, context: true, capacity: true,
    cacheLabel: true, cache: true,
    quotaGroup: true,
    quota5hIcon: true, quota5h: true, reset5h: true,
    quotaWeeklyIcon: true, quotaWeekly: true, resetWeekly: true,
  },
  compact: {
    contextLabel: false, context: true, capacity: true,
    cacheLabel: false, cache: false,
    quotaGroup: false,
    quota5hIcon: true, quota5h: true, reset5h: true,
    quotaWeeklyIcon: true, quotaWeekly: true, resetWeekly: true,
  },
};
const SHOW_KEYS = Object.keys(MODES.standard);
const DEFAULTS = {
  mode: 'standard',
  textColor: 'inherit',
  context: 'text',
  cache: 'dot',
  quota: 'dot',
  show: { ...MODES.standard },
};
const PALETTES = {
  light: { body: 'rgb(22,22,22)', muted: 'rgb(91,107,115)', neutral: 'rgb(138,144,151)', amber: 'rgb(152,97,0)', red: 'rgb(208,42,48)' },
  dark: { body: 'rgb(241,243,245)', muted: 'rgb(185,195,208)', neutral: 'rgb(185,195,208)', amber: 'rgb(255,209,102)', red: 'rgb(255,133,133)' },
};
const KNOWN_BUCKETS = {
  'gemini-5h': ['Gemini', '5h'],
  'gemini-weekly': ['Gemini', 'weekly'],
  'gemini-argon-wtu-weekly': ['Argon', 'weekly'],
  '3p-5h': ['Claude', '5h'],
  '3p-weekly': ['Claude', 'weekly'],
};

const SCENARIOS = {
  normal: {
    ageSec: 60,
    payload: {
      model: { id: 'gemini-hydrogen', display_name: 'Gemini 4 Hydrogen', effort: 'medium' },
      agent_state: 'idle',
      context_window: { used_percentage: 14.2, context_window_size: 1048576, current_usage: { input_tokens: 160, cache_read_input_tokens: 9840 } },
      quota: { 'gemini-5h': { remaining_fraction: 0.96, reset_in_seconds: 8760 }, 'gemini-weekly': { remaining_fraction: 0.19, reset_in_seconds: 342000 } },
    },
  },
  yellow: {
    ageSec: 180,
    payload: {
      model: { id: 'gemini-hydrogen', display_name: 'Gemini 4 Hydrogen', effort: 'medium' },
      agent_state: 'idle',
      context_window: { used_percentage: 75.0, context_window_size: 1048576, current_usage: { input_tokens: 160, cache_read_input_tokens: 9840 } },
      quota: { 'gemini-5h': { remaining_fraction: 0.25, reset_in_seconds: 8760 }, 'gemini-weekly': { remaining_fraction: 0.19, reset_in_seconds: 342000 } },
    },
  },
  red: {
    ageSec: 240,
    payload: {
      model: { id: 'gemini-hydrogen', display_name: 'Gemini 4 Hydrogen', effort: 'high' },
      agent_state: 'idle',
      context_window: { used_percentage: 90.0, context_window_size: 1048576, current_usage: { input_tokens: 160, cache_read_input_tokens: 9840 } },
      quota: { 'gemini-5h': { remaining_fraction: 0.96, reset_in_seconds: 8760 }, 'gemini-weekly': { remaining_fraction: 0.10, reset_in_seconds: 342000 } },
    },
  },
  claude: {
    ageSec: 90,
    payload: {
      model: { id: 'claude-sonnet-4-6', display_name: 'Claude Sonnet 4.6', effort: 'high' },
      agent_state: 'idle',
      context_window: { used_percentage: 28.4, context_window_size: 200000, current_usage: { input_tokens: 640, cache_read_input_tokens: 9360 } },
      quota: { '3p-5h': { remaining_fraction: 0.64, reset_in_seconds: 6300 }, '3p-weekly': { remaining_fraction: 0.32, reset_in_seconds: 288000 } },
    },
  },
  argon: {
    ageSec: 60,
    payload: {
      model: { id: 'gemini-argon', display_name: 'Gemini 4 Argon', effort: 'high' },
      agent_state: 'idle',
      context_window: { used_percentage: 36.1, context_window_size: 1048576, current_usage: { input_tokens: 420, cache_read_input_tokens: 9580 } },
      quota: { 'gemini-argon-wtu-weekly': { remaining_fraction: 0.16, reset_in_seconds: 346122 } },
    },
  },
};

const I18N = {
  zh: {
    subtitle: '在预览中直接点击各项开关显示，调好后复制指令发给 Agent 生效。',
    themeBoth: '日 + 夜', themeLight: '浅色', themeDark: '深色',
    scNormal: '正常', scYellow: '黄提醒', scRed: '红告警',
    widthLabel: '终端宽度', viewEdit: '编辑', viewPreview: '预览',
    editHint: '点击任意项开关显示（暗淡 = 已隐藏）',
    ctxAlert: 'Ctx 提醒', cacheAlert: 'Cache 提醒', quotaAlert: '额度提醒', textColorLabel: '正文颜色',
    optDot: '圆点 ●', optText: '文字', optOff: '关闭',
    tcInherit: '跟随正文', tcFixed: '固定黑白', tcMuted: '柔和灰',
    tabAgent: '发给 Agent (/capsule-guide)', tabCli: '终端命令 (settings.mjs)',
    copyTip: '复制', copiedTip: '已复制',
    hintAgent: '直接粘贴到 Antigravity 对话中发送，已安装 /capsule-guide skill 的 Agent 会自动调用本地 helper 生效。',
    hintCli: '在 PowerShell / bash / zsh 中运行即可，无需消耗模型调用；下一次底栏刷新生效。',
    hintJson: '保存到 ~/.gemini/config/agy-capsule/cli/settings.json；下一次底栏刷新生效。',
    dayTag: 'Day / 浅色背景', nightTag: 'Night / 深色背景',
    emptyLine: '（第 2 行所有指标均已隐藏，仅保留第 1 行模型提示）',
    footerNote: '实际终端字体宽度可能略有差异。',
  },
  en: {
    subtitle: 'Click items directly in the statusline to toggle them, then copy one command for your Agent.',
    themeBoth: 'Day + Night', themeLight: 'Light', themeDark: 'Dark',
    scNormal: 'Normal', scYellow: 'Yellow', scRed: 'Red',
    widthLabel: 'Width', viewEdit: 'Edit', viewPreview: 'Preview',
    editHint: 'Click any item to toggle (dimmed = hidden)',
    ctxAlert: 'Ctx Alert', cacheAlert: 'Cache Alert', quotaAlert: 'Quota Alert', textColorLabel: 'Body Color',
    optDot: 'Dot ●', optText: 'Text', optOff: 'Off',
    tcInherit: 'Follow Body', tcFixed: 'Fixed B/W', tcMuted: 'Muted Gray',
    tabAgent: 'Send to Agent (/capsule-guide)', tabCli: 'Terminal CLI (settings.mjs)',
    copyTip: 'Copy', copiedTip: 'Copied',
    hintAgent: 'Paste directly into Antigravity chat. With /capsule-guide installed, your agent applies it via the local helper.',
    hintCli: 'Run directly in PowerShell, bash, or zsh with zero model calls. Applies on the next statusline refresh.',
    hintJson: 'Save to ~/.gemini/config/agy-capsule/cli/settings.json. Applies on the next statusline refresh.',
    dayTag: 'Day / Light background', nightTag: 'Night / Dark background',
    emptyLine: '(All row-2 metrics hidden; only row-1 model bar is rendered)',
    footerNote: 'Terminal font widths may vary.',
  },
};

let lang = 'zh';
let viewTheme = 'dark';
let viewMode = 'edit';
let scenarioKey = 'normal';
let outputTab = 'agent';
let termWidth = 104;
const state = structuredClone(DEFAULTS);

const esc = s => s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
const span = (text, tone, theme) => `<span style="color:${PALETTES[theme][tone]}">${esc(text)}</span>`;
function charWidth(ch) {
  const cp = ch.codePointAt(0);
  if (cp > 0xffff) return 2;
  if ((cp >= 0x2e80 && cp <= 0x9fff) || (cp >= 0xf900 && cp <= 0xfaff) || (cp >= 0xff00 && cp <= 0xff60)) return 2;
  return 1;
}
function displayWidth(text) { let w = 0; for (const ch of text) w += charWidth(ch); return w; }
function clipText(text, budget) {
  let out = '', used = 0;
  for (const ch of text) { const w = charWidth(ch); if (used + w > budget) break; out += ch; used += w; }
  return out;
}
function formatTokens(n) {
  if (n < 1000) return String(Math.round(n));
  return n < 999950 ? `${(n / 1000).toFixed(1)}K` : `${(n / 1000000).toFixed(1)}M`;
}
function resetText(bucket) {
  const seconds = bucket.reset_in_seconds;
  if (seconds == null) return '';
  if (seconds <= 0) return '(due)';
  if (seconds < 60) return '(<1m)';
  const minutes = Math.ceil(seconds / 60);
  if (minutes < 60) return `(${minutes}m)`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `(${hours}h ${minutes % 60}m)`;
  return `(${Math.floor(hours / 24)}d ${hours % 24}h)`;
}
function currentGroup(model, quota) {
  const name = `${model?.id || ''} ${model?.display_name || ''}`.toLowerCase();
  if (/claude|sonnet|opus|haiku/.test(name)) return 'Claude';
  if (name.includes('argon') && quota?.['gemini-argon-wtu-weekly']) return 'Argon';
  if (/gemini|hydrogen|argon/.test(name)) return 'Gemini';
  return null;
}
function quotaTone(payload, show) {
  const selected = currentGroup(payload.model, payload.quota);
  let shortTone = 'neutral';
  for (const [id, bucket] of Object.entries(payload.quota || {})) {
    if (!bucket || bucket.disabled === true || KNOWN_BUCKETS[id]?.[0] !== selected) continue;
    const kind = KNOWN_BUCKETS[id][1];
    if (kind === '5h' && !show.quota5h && !show.quota5hIcon && !show.reset5h) continue;
    if (kind === 'weekly' && !show.quotaWeekly && !show.quotaWeeklyIcon && !show.resetWeekly) continue;
    const pct = Math.round(bucket.remaining_fraction * 100);
    const tone = pct <= 10 ? 'red' : pct <= 25 ? 'amber' : 'neutral';
    if (kind === 'weekly' && tone === 'red') return 'red';
    if (kind === '5h') shortTone = tone;
  }
  return shortTone;
}
function renderModelLineHtml(payload, theme) {
  const width = Math.max(1, termWidth - 2);
  const effort = payload.model.effort || '';
  const right = (payload.model.display_name + (effort ? ` · ${effort}` : '')).slice(0, width);
  let left = ['working', 'tool_use'].includes(payload.agent_state) ? 'esc to cancel' : '? for shortcuts';
  if (left.length + 2 + right.length > width) left = '';
  const line = left + ' '.repeat(width - left.length - right.length) + right;
  return span(line, 'muted', theme);
}

function tok(key, html, on) {
  return `<span class="tok ${on ? 'on' : 'off'}" data-show="${key}">${html}</span>`;
}

function renderEditRowHtml(payload, ageSec, theme) {
  const { show } = state;
  const width = Math.max(1, termWidth - 2);
  const ctx = payload.context_window;
  const pct = `${ctx.used_percentage.toFixed(1)}%`;
  const cap = `(${formatTokens(ctx.context_window_size)})`;
  const u = ctx.current_usage;
  const hit = `${(u.cache_read_input_tokens / (u.input_tokens + u.cache_read_input_tokens) * 100).toFixed(1)}%`;
  const cacheTone = ageSec >= 240 ? 'red' : ageSec >= 180 ? 'amber' : 'neutral';

  const pctHtml = state.context === 'text' && ctx.used_percentage >= 75
    ? span(pct, ctx.used_percentage >= 90 ? 'red' : 'amber', theme) : esc(pct);
  const ctxPlain = `Ctx ${pct} ${cap}`;
  const ctxHtml = `${tok('contextLabel', 'Ctx', show.contextLabel)} ${tok('context', pctHtml, show.context)} ${tok('capacity', esc(cap), show.capacity)}`;

  const cacheTextColor = state.cache === 'text' && cacheTone !== 'neutral';
  const cacheLabelHtml = cacheTextColor ? span('Cache', cacheTone, theme) : 'Cache';
  const cacheHitHtml = cacheTextColor ? span(hit, cacheTone, theme) : esc(hit);
  const cacheActive = show.cache || show.cacheLabel;
  const cacheDotPlain = state.cache === 'dot' ? ' ●' : '';
  const cacheDotHtml = state.cache === 'dot'
    ? ` <span style="opacity:${cacheActive ? 1 : 0.25}">${span('●', cacheTone, theme)}</span>` : '';
  const cachePlain = `Cache ${hit}${cacheDotPlain}`;
  const cacheHtml = `${tok('cacheLabel', cacheLabelHtml, show.cacheLabel)} ${tok('cache', cacheHitHtml, show.cache)}${cacheDotHtml}`;

  const leftPlain = `${ctxPlain}  ${cachePlain}`;
  const leftHtml = `${ctxHtml}  ${cacheHtml}`;

  const selected = currentGroup(payload.model, payload.quota);
  const rightPlainParts = [];
  const rightHtmlParts = [];
  const anyRightOn = show.quotaGroup || show.quota5hIcon || show.quota5h || show.reset5h || show.quotaWeeklyIcon || show.quotaWeekly || show.resetWeekly;
  if (state.quota === 'dot') {
    rightPlainParts.push('●');
    rightHtmlParts.push(`<span style="opacity:${anyRightOn ? 1 : 0.25}">${span('●', quotaTone(payload, show), theme)}</span>`);
  }
  rightPlainParts.push(selected);
  rightHtmlParts.push(tok('quotaGroup', esc(selected), show.quotaGroup));

  for (const [id, bucket] of Object.entries(payload.quota)) {
    const meta = KNOWN_BUCKETS[id];
    if (!meta || meta[0] !== selected || bucket.disabled) continue;
    const kind = meta[1];
    const pctNum = Math.round(bucket.remaining_fraction * 100);
    const valStr = `${pctNum}%`;
    const valHtml = state.quota === 'text' && pctNum <= 25
      ? span(valStr, pctNum <= 10 ? 'red' : 'amber', theme) : esc(valStr);
    const rt = resetText(bucket);
    if (kind === '5h') {
      rightPlainParts.push('🕔', valStr, rt);
      rightHtmlParts.push(
        tok('quota5hIcon', '🕔', show.quota5hIcon),
        tok('quota5h', valHtml, show.quota5h),
        tok('reset5h', esc(rt), show.reset5h),
      );
    } else if (kind === 'weekly') {
      rightPlainParts.push('📅', valStr, rt);
      rightHtmlParts.push(
        tok('quotaWeeklyIcon', '📅', show.quotaWeeklyIcon),
        tok('quotaWeekly', valHtml, show.quotaWeekly),
        tok('resetWeekly', esc(rt), show.resetWeekly),
      );
    }
  }
  const rightPlain = rightPlainParts.join(' ');
  const rightHtml = rightHtmlParts.join(' ');
  const pad = ' '.repeat(Math.max(2, width - displayWidth(leftPlain) - displayWidth(rightPlain)));
  const baseColor = state.textColor === 'fixed' ? PALETTES[theme].body : state.textColor === 'muted' ? PALETTES[theme].muted : null;
  const rowHtml = leftHtml + pad + rightHtml;
  return baseColor ? `<span style="color:${baseColor}">${rowHtml}</span>` : rowHtml;
}

function renderPreviewRowHtml(payload, ageSec, theme) {
  const { show } = state;
  const width = Math.max(1, termWidth - 2);
  const ctx = payload.context_window;
  const pct = `${ctx.used_percentage.toFixed(1)}%`;
  const cap = `(${formatTokens(ctx.context_window_size)})`;
  const u = ctx.current_usage;
  const cacheHit = u && width >= 30
    ? `${(u.cache_read_input_tokens / (u.input_tokens + u.cache_read_input_tokens) * 100).toFixed(1)}%` : null;

  const buildLeft = (opts) => {
    const ctxParts = [];
    if (opts.withContext && show.contextLabel) ctxParts.push(opts.shortContext ? 'C' : 'Ctx');
    if (opts.withContext && show.context) ctxParts.push(pct);
    if (opts.withCapacity && show.capacity) ctxParts.push(cap);
    const cacheParts = [];
    if (opts.withCache && cacheHit !== null) {
      if (show.cacheLabel) cacheParts.push('Cache');
      if (show.cache) cacheParts.push(cacheHit);
      if (cacheParts.length && state.cache === 'dot') cacheParts.push('●');
    }
    return [ctxParts.join(' '), cacheParts.join(' ')].filter(Boolean).join('  ');
  };

  const anyRightEnabled = show.quotaGroup || show.quota5hIcon || show.quota5h || show.reset5h || show.quotaWeeklyIcon || show.quotaWeekly || show.resetWeekly;
  const buildRight = (countdown, showName) => {
    if (!anyRightEnabled) return '';
    const selected = currentGroup(payload.model, payload.quota);
    if (!selected) return (show.quota5h || show.quotaWeekly) ? '--' : '';
    const parts = [];
    for (const [id, bucket] of Object.entries(payload.quota)) {
      const meta = KNOWN_BUCKETS[id];
      if (!meta || meta[0] !== selected || bucket.disabled) continue;
      const kind = meta[1];
      const val = `${Math.round(bucket.remaining_fraction * 100)}%`;
      const bp = [];
      if (kind === '5h') {
        if (show.quota5hIcon) bp.push('🕔');
        if (show.quota5h) bp.push(val);
        if (countdown && show.reset5h) bp.push(resetText(bucket));
      } else if (kind === 'weekly') {
        if (show.quotaWeeklyIcon) bp.push('📅');
        if (show.quotaWeekly) bp.push(val);
        if (countdown && show.resetWeekly) bp.push(resetText(bucket));
      }
      if (bp.length) parts.push(bp.join(' '));
    }
    const text = [showName ? selected : '', ...parts].filter(Boolean).join(' ');
    return text ? `${state.quota === 'dot' ? '● ' : ''}${text}` : '';
  };

  let leftOpts = { withContext: true, withCapacity: true, withCache: true, shortContext: false };
  let left = buildLeft(leftOpts);
  let right = buildRight(width >= 70, show.quotaGroup);
  const fits = () => displayWidth(left) + (left && right ? 2 : 0) + displayWidth(right) <= width;

  if (!fits()) right = buildRight(false, show.quotaGroup);
  if (!fits() && (show.context || show.contextLabel || show.capacity)) { leftOpts = { ...leftOpts, withCache: false }; left = buildLeft(leftOpts); }
  if (!fits() && (show.context || show.contextLabel)) { leftOpts = { ...leftOpts, withCapacity: false }; left = buildLeft(leftOpts); }
  if (!fits()) right = buildRight(false, false);
  let leftClipped = false;
  if (!fits()) {
    if (right) {
      leftOpts = { withContext: width >= 12 && (show.context || show.contextLabel), withCapacity: false, withCache: false, shortContext: true };
      left = buildLeft(leftOpts);
      const budget = Math.max(1, width - displayWidth(left) - (left ? 1 : 0));
      right = clipText(right, budget);
    } else {
      leftOpts = { ...leftOpts, withCache: (show.context || show.contextLabel) ? false : leftOpts.withCache, shortContext: true };
      left = buildLeft(leftOpts);
      if (!fits()) { left = clipText(left, width); leftClipped = true; }
    }
  }
  if (!left && !right) return `<span class="empty-hint">${esc(I18N[lang].emptyLine)}</span>`;

  const padding = right ? ' '.repeat(Math.max(0, width - displayWidth(left) - displayWidth(right))) : '';
  const cacheTone = ageSec >= 240 ? 'red' : ageSec >= 180 ? 'amber' : 'neutral';
  let leftHtml = esc(left);
  if (left && !leftClipped) {
    const ctxParts = [];
    if (leftOpts.withContext && show.contextLabel) ctxParts.push(leftOpts.shortContext ? 'C' : 'Ctx');
    if (leftOpts.withContext && show.context) {
      ctxParts.push(state.context === 'text' && ctx.used_percentage >= 75
        ? span(pct, ctx.used_percentage >= 90 ? 'red' : 'amber', theme) : esc(pct));
    }
    if (leftOpts.withCapacity && show.capacity) ctxParts.push(esc(cap));
    let cacheHtml = '';
    if (leftOpts.withCache && cacheHit !== null) {
      const cp = [];
      if (show.cacheLabel) cp.push('Cache');
      if (show.cache) cp.push(cacheHit);
      if (cp.length) {
        const raw = cp.join(' ');
        if (state.cache === 'dot') cacheHtml = `${esc(raw)} ${span('●', cacheTone, theme)}`;
        else if (state.cache === 'text' && cacheTone !== 'neutral') cacheHtml = span(raw, cacheTone, theme);
        else cacheHtml = esc(raw);
      }
    }
    leftHtml = [ctxParts.join(' '), cacheHtml].filter(Boolean).join('  ');
  }
  let rightHtml = esc(right);
  if (right) {
    if (state.quota === 'dot') rightHtml = rightHtml.replace('●', span('●', quotaTone(payload, show), theme));
    else if (state.quota === 'text') {
      rightHtml = rightHtml.replace(/\b(\d+)%/g, (m, p) => Number(p) <= 25 ? span(m, Number(p) <= 10 ? 'red' : 'amber', theme) : m);
    }
  }
  const baseColor = state.textColor === 'fixed' ? PALETTES[theme].body : state.textColor === 'muted' ? PALETTES[theme].muted : null;
  const rowHtml = leftHtml + padding + rightHtml;
  return baseColor ? `<span style="color:${baseColor}">${rowHtml}</span>` : rowHtml;
}

function diffCount(modeName) {
  const base = MODES[modeName];
  let n = 0;
  for (const k of SHOW_KEYS) if (state.show[k] !== base[k]) n++;
  return n;
}
function bestMode() {
  return diffCount('compact') < diffCount('standard') ? 'compact' : 'standard';
}
function getOverrides(modeName) {
  const base = MODES[modeName];
  const overrides = {};
  for (const k of SHOW_KEYS) if (state.show[k] !== base[k]) overrides[k] = state.show[k];
  return overrides;
}
function isExactDefault() {
  for (const k of ['textColor', 'context', 'cache', 'quota']) {
    if (state[k] !== DEFAULTS[k]) return false;
  }
  return Object.keys(getOverrides('standard')).length === 0;
}
function buildHelperArgs() {
  if (isExactDefault()) return 'reset';
  const modeName = bestMode();
  const args = [
    'set',
    'mode', modeName,
    'textColor', state.textColor,
    'context', state.context,
    'cache', state.cache,
    'quota', state.quota,
  ];
  const overrides = getOverrides(modeName);
  for (const [k, v] of Object.entries(overrides)) {
    args.push(`show.${k}`, v ? 'on' : 'off');
  }
  return args.join(' ');
}
function buildSettingsJson() {
  const modeName = bestMode();
  const obj = {
    mode: modeName,
    context: state.context,
    cache: state.cache,
    quota: state.quota,
  };
  if (state.textColor !== DEFAULTS.textColor) obj.textColor = state.textColor;
  const overrides = getOverrides(modeName);
  if (Object.keys(overrides).length) obj.show = overrides;
  return JSON.stringify(obj, null, 2);
}
function currentOutputText() {
  const helperArgs = buildHelperArgs();
  if (outputTab === 'agent') return `/capsule-guide ${helperArgs}`;
  if (outputTab === 'cli') return `node "$HOME/.gemini/config/agy-capsule/cli/settings.mjs" ${helperArgs}`;
  return buildSettingsJson();
}

const COPY_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function updateCopyButtonLabel(copied) {
  const t = I18N[lang];
  const btn = document.getElementById('copy-btn');
  btn.classList.toggle('copied', copied);
  btn.innerHTML = copied ? CHECK_SVG : COPY_SVG;
  btn.title = copied ? t.copiedTip : t.copyTip;
  btn.setAttribute('aria-label', btn.title);
}

function applyI18n() {
  const t = I18N[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key]) el.textContent = t[key];
  });
  updateCopyButtonLabel(false);
}

function syncUI() {
  document.querySelectorAll('.pill-group[data-select]').forEach(group => {
    const key = group.dataset.select;
    group.querySelectorAll('button[data-val]').forEach(btn => {
      btn.classList.toggle('active', state[key] === btn.dataset.val);
    });
  });

  const sc = SCENARIOS[scenarioKey];
  const themes = viewTheme === 'both' ? ['light', 'dark'] : [viewTheme];
  const container = document.getElementById('terminals');
  container.innerHTML = themes.map(th => {
    const tag = th === 'light' ? I18N[lang].dayTag : I18N[lang].nightTag;
    const hint = viewMode === 'edit' ? `<span>${esc(I18N[lang].editHint)}</span>` : '';
    const row2 = viewMode === 'edit'
      ? renderEditRowHtml(sc.payload, sc.ageSec, th)
      : renderPreviewRowHtml(sc.payload, sc.ageSec, th);
    return `<div class="terminal ${th}"><div class="terminal-head"><span class="terminal-tag">${esc(tag)}</span>${hint}</div><pre>${renderModelLineHtml(sc.payload, th)}\n${row2}</pre></div>`;
  }).join('');

  container.querySelectorAll('.tok[data-show]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.show;
      state.show[k] = !state.show[k];
      syncUI();
    });
  });

  document.getElementById('output-box').textContent = currentOutputText();
  const t = I18N[lang];
  document.getElementById('output-hint').textContent = outputTab === 'agent' ? t.hintAgent : outputTab === 'cli' ? t.hintCli : t.hintJson;
  updateCopyButtonLabel(false);
}

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('active', b === btn));
    applyI18n();
    syncUI();
  });
});

document.querySelectorAll('[data-theme]').forEach(btn => {
  btn.addEventListener('click', () => {
    viewTheme = btn.dataset.theme;
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('active', b === btn));
    syncUI();
  });
});

document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.view;
    document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b === btn));
    syncUI();
  });
});

document.querySelectorAll('#scenario-pills [data-scenario]').forEach(btn => {
  btn.addEventListener('click', () => {
    scenarioKey = btn.dataset.scenario;
    document.querySelectorAll('#scenario-pills [data-scenario]').forEach(b => b.classList.toggle('active', b === btn));
    syncUI();
  });
});

document.getElementById('width-slider').addEventListener('input', e => {
  termWidth = Number(e.target.value);
  document.getElementById('width-val').textContent = String(termWidth);
  syncUI();
});

document.querySelectorAll('.pill-group[data-select]').forEach(group => {
  const key = group.dataset.select;
  group.querySelectorAll('button[data-val]').forEach(btn => {
    btn.addEventListener('click', () => {
      state[key] = btn.dataset.val;
      syncUI();
    });
  });
});

document.querySelectorAll('#output-tabs [data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    outputTab = btn.dataset.tab;
    document.querySelectorAll('#output-tabs [data-tab]').forEach(b => b.classList.toggle('active', b === btn));
    syncUI();
  });
});

let copyTimer = null;
document.getElementById('copy-btn').addEventListener('click', async () => {
  const text = currentOutputText();
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  updateCopyButtonLabel(true);
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => updateCopyButtonLabel(false), 1800);
});

applyI18n();
syncUI();
</script>
</body>
</html>
